name: CI

on:
  push:
    # multica-moct merges are the SHAs M-151 deploys: CI must run on them to
    # publish the web-dist/multica-be artifacts that deploy downloads (M-161).
    branches: [main, multica-moct]
  pull_request:
    # multica-moct is where the dsh integration lane merges; without it here no
    # PR into that branch ever gets checks.
    branches: [main, multica-moct]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # PRs and pushes select scopes by path; workflow_dispatch forces them all.
  # The nightly run moved to nightly.yml (M-161), which has no path filter.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.decide.outputs.frontend }}
      backend: ${{ steps.decide.outputs.backend }}
      sqlc: ${{ steps.decide.outputs.sqlc }}
      quality_only: ${{ steps.decide.outputs.quality_only }}
      scripts: ${{ steps.decide.outputs.scripts }}
      runner: ${{ steps.runner.outputs.runner }}
      self_hosted: ${{ steps.runner.outputs.self_hosted }}
      unreviewed_deps: ${{ steps.runner.outputs.unreviewed_deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The self-hosted pool must never be reachable from a workflow that runs
      # untrusted fork code with credentials (pull_request_target) or that is
      # re-triggered by privileged events (workflow_run). mmx/self-hosted/CI_
      # RUNNER references mark a workflow as pool-aware; combining the two is
      # how an untrusted workflow would get a self-hosted runner.
      - name: Reject pull_request_target or workflow_run combined with self-hosted labels
        run: |
          status=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            if grep -qE '^[[:space:]]*(pull_request_target|workflow_run):' "$f" && \
               grep -qE 'mmx|self-hosted|CI_RUNNER|MMX_CI_ALLOWLIST|outputs\.runner' "$f"; then
              echo "::error file=$f::pull_request_target/workflow_run must not be combined with self-hosted (mmx) runner references"
              status=1
            fi
          done
          exit $status

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Test CI selection and gates
        run: node --test scripts/ci-scope.test.mjs

      - name: Test the MMX version stamp script
        run: node --test scripts/mmx-version.test.mjs

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          # Pushes compare before/head SHAs. PRs use the pull-request file API;
          # paths-filter ignores base/ref for pull_request events.
          base: ${{ github.event_name == 'push' && github.event.before || github.base_ref }}
          ref: ${{ github.sha }}
          filters: .github/ci-paths.json

      # Dependency files gate cache isolation: an unreviewed lockfile change
      # must not write the shared runner caches (M-150).
      - name: Filter dependency files
        id: deps
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.base_ref }}
          ref: ${{ github.sha }}
          filters: |
            deps:
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'patches/**'

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_RESULTS: ${{ toJSON(steps.filter.outputs) }}
        run: node scripts/ci-scope.mjs decide

      - name: Decide runner
        id: runner
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ALLOWLIST: ${{ vars.MMX_CI_ALLOWLIST }}
          CI_RUNNER: ${{ vars.CI_RUNNER }}
          DEPS_CHANGED: ${{ steps.deps.outputs.deps }}
          REVIEW_DECISION: ${{ github.event.pull_request.review_decision }}
        run: node scripts/ci-scope.mjs runner

  # Container-isolation proof (M-164): every job step runs inside a rootless
  # podman container. This job proves (a) the container cannot reach host
  # loopback, (b) the container cannot reach host services via the pasta
  # gateway (lane ports 3180/3702/4320/5432 + ssh + LAN), (c) host paths are
  # not mounted, (d) the runner env carries no tokens / MULTICA_* vars.
  # The host wrapper starts a canary listener on 0.0.0.0:$CANARY_PORT for the
  # job's lifetime; $CANARY_PORT defaults to 39180.
  mmx-firewall:
    needs: changes
    if: ${{ needs.changes.outputs.self_hosted == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - name: Positive control - DNS and egress must work
        run: |
          getent hosts github.com || { echo "::error::DNS resolution broken (mmx-ci)"; exit 1; }
          curl -sf --max-time 10 https://github.com/ -o /dev/null || { echo "::error::egress to github.com broken (mmx-ci)"; exit 1; }
      - name: Container cannot reach host loopback
        run: |
          rc=0
          curl --max-time 3 "http://127.0.0.1:${CANARY_PORT:-39180}/" -o /dev/null 2>/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::host loopback reachable from container - isolation broken"
            exit 1
          fi
          echo "host loopback not reachable from container (rc=$rc)"
      - name: Container cannot reach host loopback over IPv6
        run: |
          rc=0
          curl -6 --max-time 3 "http://[::1]:${CANARY_PORT:-39180}/" -o /dev/null 2>/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::host IPv6 loopback reachable from container - isolation broken"
            exit 1
          fi
          echo "host IPv6 loopback not reachable from container (rc=$rc)"
      - name: Container cannot reach host services via gateway
        run: |
          gw="${HOST_GATEWAY:-host.containers.internal}"
          for port in 3180 3702 4320 5432 22; do
            rc=0
            curl --max-time 3 "http://${gw}:${port}/" -o /dev/null 2>/dev/null || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 52 ]; then
              echo "::error::gateway port $port reachable from container (rc=$rc) - filter not applied"
              exit 1
            fi
            echo "gateway port $port blocked (rc=$rc)"
          done
          # canary on the gateway must time out (proves the filter drops, not refuses)
          rc=0
          curl --max-time 3 "http://${gw}:${CANARY_PORT:-39180}/" -o /dev/null 2>/dev/null || rc=$?
          if [ "$rc" -ne 28 ]; then
            echo "::error::canary expected timeout (28), got $rc - filter not dropping"
            exit 1
          fi
          echo "canary dropped (curl timeout as required)"
      - name: Container has no host paths mounted
        run: |
          test ! -e /home/ddv/.multica || { echo "::error::/home/ddv/.multica visible in container"; exit 1; }
          test ! -S /run/user/1000/bus || { echo "::error::host dbus socket visible"; exit 1; }
          test ! -d /mnt/workspace/clouds/runners/moct || { echo "::error::sibling runner dir visible"; exit 1; }
          echo "no host paths mounted"
      - name: Container env carries no tokens or MULTICA vars
        run: |
          if env | grep -E '^(MULTICA_|GH_TOKEN|RUNNER_TOKEN)=' >/dev/null; then
            echo "::error::secret/token env var present in container"
            env | grep -E '^(MULTICA_|GH_TOKEN|RUNNER_TOKEN)='
            exit 1
          fi
          echo "env clean"

  sqlc-check:
    needs: changes
    if: ${{ needs.changes.outputs.sqlc == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Verify generated SQL is up to date
        run: |
          make sqlc
          git diff --exit-code -- server/pkg/db/generated
          untracked="$(git ls-files --others --exclude-standard -- server/pkg/db/generated)"
          if [ -n "$untracked" ]; then
            printf 'Untracked generated SQL files:\n%s\n' "$untracked"
            exit 1
          fi

  # The frontend lane runs typecheck, lint, build and the suites in parallel,
  # each on its own runner with its own turbo cache prefix (M-161). On a full
  # cache miss the combined build/typecheck/lint job measured 408s and was the
  # lane's long pole; splitting it lets every worker start from a warm install
  # and finish in parallel. The extra setup increases total runner-minutes but
  # cuts wall-clock feedback time.

  frontend-typecheck:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 30
    env:
      # Pin turbo's filesystem cache somewhere actions/cache can address.
      # Overridden for self-hosted runs by the cache configuration step below.
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          # Hosted jobs round-trip the pnpm store through actions/cache. On
          # self-hosted the store persists on the runner disk, so the tarball
          # round-trip is pure overhead and is skipped.
          cache: ${{ needs.changes.outputs.self_hosted != 'true' && 'pnpm' || '' }}

      # Self-hosted runners share one warm pnpm store and one turbo cache on
      # the runner disk. An unreviewed dependency change (new lockfile entry)
      # must not poison either, so those runs get per-run scratch directories
      # instead.
      - name: Configure cache directories
        env:
          SELF_HOSTED: ${{ needs.changes.outputs.self_hosted }}
          UNREVIEWED_DEPS: ${{ needs.changes.outputs.unreviewed_deps }}
        run: |
          if [ "$SELF_HOSTED" != "true" ]; then
            echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"
          elif [ "$UNREVIEWED_DEPS" = "true" ]; then
            base="/mnt/workspace/cache/mmx/scratch/${GITHUB_RUN_ID}"
            mkdir -p "$base/turbo" "$base/pnpm-store"
            echo "TURBO_CACHE_DIR=$base/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=$base/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=$base/pnpm-store" >> "$GITHUB_ENV"
          else
            echo "TURBO_CACHE_DIR=/mnt/workspace/cache/mmx/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install

      # `node-version: 22` above floats across patch releases, and turbo's
      # global hash does not include the interpreter at all (`engines` is null
      # in its dry-run cache inputs). Without the resolved version in the key,
      # a runner silently moving to another 22.x would restore a cache built by
      # the old interpreter and report green without executing anything.
      - name: Resolve runtime for cache key
        id: runtime
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # Cache entries are immutable, so the key carries the commit SHA to make
      # every run publish a fresh one and `restore-keys` falls back to the most
      # recent prefix match. Each frontend worker runs a disjoint task set, so
      # it gets its own prefix rather than racing to save one key.
      # GitHub scopes caches by branch: a PR reads main's entries (so unchanged
      # tasks hit on the first push) and writes its own (so re-pushes hit too).
      - name: Restore turbo cache
        if: needs.changes.outputs.self_hosted != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-
      # Mobile is excluded from every root turbo invocation (see root
      # package.json scripts); keep these filters in sync with them.
      - name: Type check
        run: pnpm exec turbo typecheck --filter='!@multica/docs' --filter='!@multica/mobile'
  frontend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 30
    env:
      # Pin turbo's filesystem cache somewhere actions/cache can address.
      # Overridden for self-hosted runs by the cache configuration step below.
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          # Hosted jobs round-trip the pnpm store through actions/cache. On
          # self-hosted the store persists on the runner disk, so the tarball
          # round-trip is pure overhead and is skipped.
          cache: ${{ needs.changes.outputs.self_hosted != 'true' && 'pnpm' || '' }}

      # Self-hosted runners share one warm pnpm store and one turbo cache on
      # the runner disk. An unreviewed dependency change (new lockfile entry)
      # must not poison either, so those runs get per-run scratch directories
      # instead.
      - name: Configure cache directories
        env:
          SELF_HOSTED: ${{ needs.changes.outputs.self_hosted }}
          UNREVIEWED_DEPS: ${{ needs.changes.outputs.unreviewed_deps }}
        run: |
          if [ "$SELF_HOSTED" != "true" ]; then
            echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"
          elif [ "$UNREVIEWED_DEPS" = "true" ]; then
            base="/mnt/workspace/cache/mmx/scratch/${GITHUB_RUN_ID}"
            mkdir -p "$base/turbo" "$base/pnpm-store"
            echo "TURBO_CACHE_DIR=$base/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=$base/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=$base/pnpm-store" >> "$GITHUB_ENV"
          else
            echo "TURBO_CACHE_DIR=/mnt/workspace/cache/mmx/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install

      # `node-version: 22` above floats across patch releases, and turbo's
      # global hash does not include the interpreter at all (`engines` is null
      # in its dry-run cache inputs). Without the resolved version in the key,
      # a runner silently moving to another 22.x would restore a cache built by
      # the old interpreter and report green without executing anything.
      - name: Resolve runtime for cache key
        id: runtime
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # Cache entries are immutable, so the key carries the commit SHA to make
      # every run publish a fresh one and `restore-keys` falls back to the most
      # recent prefix match. Each frontend worker runs a disjoint task set, so
      # it gets its own prefix rather than racing to save one key.
      # GitHub scopes caches by branch: a PR reads main's entries (so unchanged
      # tasks hit on the first push) and writes its own (so re-pushes hit too).
      - name: Restore turbo cache
        if: needs.changes.outputs.self_hosted != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-
      - name: Lint
        run: pnpm exec turbo lint --filter='!@multica/docs' --filter='!@multica/mobile'

      # M-155: one string per build. The stamp comes from the head commit's
      # committer time (--from-git), so the same SHA always yields the same
      # string; CI prints it and fails unless the shipped bundle and the
      # release.json line both contain it. Turbo's cache key cannot see
      # committer time — a restored bundle may carry an older stamp — so the
      # plugin is rebuilt directly here with the stamp exported, and the
      # asserted bundle is the one this step just produced. The shipped
      # artifact is lib/client.js: scripts/wrap-client.mjs wraps and then
      # deletes vite's intermediate client.bundle.cjs.
      - name: Assert the MMX version stamp
        run: |
          MMX_BUILD_JSON="$(node scripts/mmx-version.mjs --from-git --json)"
          echo "mmx: $MMX_BUILD_JSON"
          export MMX_BUILD_JSON
          STAMP="$(node -p 'JSON.parse(process.env.MMX_BUILD_JSON).stamp')"
          pnpm --filter @multica/dsh-plugin build
          if ! grep -qF "$STAMP" packages/dsh-plugin/lib/client.js; then
            echo "client bundle does not contain $STAMP"
            exit 1
          fi
          node scripts/mmx-version.mjs --release-json --ref ci > release.json
          if ! grep -qF "$STAMP" release.json; then
            echo "release.json does not contain $STAMP"
            exit 1
          fi
          echo "stamp verified in bundle and release.json: $STAMP"

      # M-151: lane z's Multica UI is this plugin row, not the apps/web bundle
      # web-dist carries, so a merge that changes the plugin has to ship the
      # built row or the lane keeps rendering stale code behind a fresh backend.
      # Packaged by the lane's own script (same shape a hand-built bundle has,
      # load check included) and uploaded only on push. The auto-deploy treats
      # a missing dsh-plugin artifact as "the plugin did not change".
      - name: Stage dsh-plugin artifact
        if: github.event_name != 'pull_request'
        run: bash deploy/dsh-z/build-plugin-bundle.sh . "" dist/dsh-plugin

      - name: Upload dsh-plugin artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-plugin-${{ github.sha }}
          if-no-files-found: error
          path: dist/dsh-plugin

      - name: Check frontend quality
        uses: ./.github/actions/frontend-quality
  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 30
    env:
      # Pin turbo's filesystem cache somewhere actions/cache can address.
      # Overridden for self-hosted runs by the cache configuration step below.
      TURBO_CACHE_DIR: .turbo/cache
      # Emit apps/web as the standalone bundle Dockerfile.web ships, so the
      # web-dist artifact below is deployable as-is (M-161). Declared in
      # turbo.json globalEnv so a cached non-standalone build can never be
      # replayed for this job.
      STANDALONE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          # Hosted jobs round-trip the pnpm store through actions/cache. On
          # self-hosted the store persists on the runner disk, so the tarball
          # round-trip is pure overhead and is skipped.
          cache: ${{ needs.changes.outputs.self_hosted != 'true' && 'pnpm' || '' }}

      # Self-hosted runners share one warm pnpm store and one turbo cache on
      # the runner disk. An unreviewed dependency change (new lockfile entry)
      # must not poison either, so those runs get per-run scratch directories
      # instead.
      - name: Configure cache directories
        env:
          SELF_HOSTED: ${{ needs.changes.outputs.self_hosted }}
          UNREVIEWED_DEPS: ${{ needs.changes.outputs.unreviewed_deps }}
        run: |
          if [ "$SELF_HOSTED" != "true" ]; then
            echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"
          elif [ "$UNREVIEWED_DEPS" = "true" ]; then
            base="/mnt/workspace/cache/mmx/scratch/${GITHUB_RUN_ID}"
            mkdir -p "$base/turbo" "$base/pnpm-store"
            echo "TURBO_CACHE_DIR=$base/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=$base/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=$base/pnpm-store" >> "$GITHUB_ENV"
          else
            echo "TURBO_CACHE_DIR=/mnt/workspace/cache/mmx/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install

      # `node-version: 22` above floats across patch releases, and turbo's
      # global hash does not include the interpreter at all (`engines` is null
      # in its dry-run cache inputs). Without the resolved version in the key,
      # a runner silently moving to another 22.x would restore a cache built by
      # the old interpreter and report green without executing anything.
      - name: Resolve runtime for cache key
        id: runtime
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # Cache entries are immutable, so the key carries the commit SHA to make
      # every run publish a fresh one and `restore-keys` falls back to the most
      # recent prefix match. Each frontend worker runs a disjoint task set, so
      # it gets its own prefix rather than racing to save one key.
      # GitHub scopes caches by branch: a PR reads main's entries (so unchanged
      # tasks hit on the first push) and writes its own (so re-pushes hit too).
      - name: Restore turbo cache
        if: needs.changes.outputs.self_hosted != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-
      - name: Build
        # STANDALONE=true (job env above) makes apps/web emit the same
        # standalone output Dockerfile.web ships, so the web-dist artifact
        # below is what production runs.
        run: pnpm exec turbo build --filter='!@multica/docs' --filter='!@multica/mobile'

      # Build-once, deploy-that-artifact (M-161): every merge publishes the
      # web-dist bundle M-151 downloads instead of rebuilding. PR runs build
      # the same way (identical turbo hash) but skip the upload.
      - name: Stage release.json
        if: github.event_name != 'pull_request'
        # M-155's single source for the release.json body; carries the
        # x.x.x-yyMMMdd.HH.mm stamp so M-151's evidence matches CI.
        run: node scripts/mmx-version.mjs --release-json --ref "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" > release.json

      - name: Upload web-dist artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist-${{ github.sha }}
          if-no-files-found: error
          # v4 drops hidden files by default; .next/ IS a dot-directory.
          include-hidden-files: true
          path: |
            apps/web/.next/standalone
            apps/web/.next/static
            apps/web/public
            release.json
  frontend-test:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 30
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: ${{ needs.changes.outputs.self_hosted != 'true' && 'pnpm' || '' }}

      - name: Configure cache directories
        env:
          SELF_HOSTED: ${{ needs.changes.outputs.self_hosted }}
          UNREVIEWED_DEPS: ${{ needs.changes.outputs.unreviewed_deps }}
        run: |
          if [ "$SELF_HOSTED" != "true" ]; then
            echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"
          elif [ "$UNREVIEWED_DEPS" = "true" ]; then
            base="/mnt/workspace/cache/mmx/scratch/${GITHUB_RUN_ID}"
            mkdir -p "$base/turbo" "$base/pnpm-store"
            echo "TURBO_CACHE_DIR=$base/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=$base/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=$base/pnpm-store" >> "$GITHUB_ENV"
          else
            echo "TURBO_CACHE_DIR=/mnt/workspace/cache/mmx/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Resolve runtime for cache key
        id: runtime
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # See frontend-typecheck for the key strategy. These entries are tiny (~60KB
      # measured): `test` declares no outputs, so turbo caches exit codes and
      # logs rather than artifacts -- yet a hit still skips the whole suite,
      # which is the single most expensive task in the graph.
      - name: Restore turbo cache
        if: needs.changes.outputs.self_hosted != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-

      - name: Test web, core, and desktop
        # Same filter rationale as frontend-build. Type errors are not this
        # job's responsibility -- frontend-typecheck owns the `typecheck` task.
        # `test` reaches dependency sources through the hash-only
        # `^cache-inputs` edge (see turbo.json), so no `tsc` runs here.
        run: pnpm exec turbo test --filter='!@multica/docs' --filter='!@multica/mobile' --filter='!@multica/views'

  # Split views across four runners (M-161: two shards still measured 270s
  # each cold, over the 2-minute per-job target). GitHub reports the matrix
  # job's combined result, so the aggregate gate keeps one job ID.
  frontend-views-test:
    name: frontend-views-test (${{ matrix.index }}/${{ matrix.total }})
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            total: 4
          - index: 2
            total: 4
          - index: 3
            total: 4
          - index: 4
            total: 4
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 30
    env:
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: ${{ needs.changes.outputs.self_hosted != 'true' && 'pnpm' || '' }}

      - name: Configure cache directories
        env:
          SELF_HOSTED: ${{ needs.changes.outputs.self_hosted }}
          UNREVIEWED_DEPS: ${{ needs.changes.outputs.unreviewed_deps }}
        run: |
          if [ "$SELF_HOSTED" != "true" ]; then
            echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"
          elif [ "$UNREVIEWED_DEPS" = "true" ]; then
            base="/mnt/workspace/cache/mmx/scratch/${GITHUB_RUN_ID}"
            mkdir -p "$base/turbo" "$base/pnpm-store"
            echo "TURBO_CACHE_DIR=$base/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=$base/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=$base/pnpm-store" >> "$GITHUB_ENV"
          else
            echo "TURBO_CACHE_DIR=/mnt/workspace/cache/mmx/turbo" >> "$GITHUB_ENV"
            echo "PNPM_STORE_DIR=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Resolve runtime for cache key
        id: runtime
        run: echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

      # Each shard has its own prefix so concurrent jobs never race to save the
      # same immutable cache key. Turbo also includes the passthrough `--shard`
      # argument in the task hash, while dependency sources still flow through
      # turbo.json's hash-only `^cache-inputs` edge.
      - name: Restore turbo cache
        if: needs.changes.outputs.self_hosted != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: turbo-views-test-${{ matrix.index }}-of-${{ matrix.total }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-${{ github.sha }}
          restore-keys: |
            turbo-views-test-${{ matrix.index }}-of-${{ matrix.total }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.node }}-

      - name: Test views shard ${{ matrix.index }}/${{ matrix.total }}
        run: pnpm exec turbo test --filter='@multica/views' -- --shard=${{ matrix.index }}/${{ matrix.total }}

  # Preserve the aggregate check names while validating intentional skips.
  frontend:
    needs: [changes, frontend-typecheck, frontend-lint, frontend-build, frontend-test, frontend-views-test, frontend-quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check frontend job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          JOB_SCOPES: '{"frontend-typecheck":"frontend","frontend-lint":"frontend","frontend-build":"frontend","frontend-test":"frontend","frontend-views-test":"frontend","frontend-quality":"quality_only"}'
        run: node scripts/ci-scope.mjs gate

  # The Go caches stay explicit rather than setup-go's `cache: true`: setup-go
  # keys on go.sum alone and once shared that key across every Linux job, so a
  # short job saved a module-only entry the big compile job then "hit" forever
  # (MUL-7280). Two entry families now:
  #
  #  * Module cache `go-mod-{os}-{arch}-{go.sum hash}`: immutable, saved on a
  #    miss, never grows. backend-build is the ONLY writer and runs an explicit
  #    `go mod download` first, so the entry always holds the complete module
  #    graph rather than one job's slice. Every other Go job restores only.
  #  * Build cache: one prefix per job (`go-build-build-`, `go-build-db-`,
  #    `go-build-pkg-`, `go-build-agent-`, nightly keeps `go-build-race-`), so
  #    concurrent jobs never race to save the same immutable key. Keys carry
  #    the resolved Go version because `check-latest` floats across patch
  #    releases, and ImageOS because cached cgo objects are linked against the
  #    runner's glibc: when ubuntu-latest moves, an entry from the old image
  #    must not be restored (actions/setup-go#368). PR runs restore and leave;
  #    pushes to main/multica-moct publish, one entry per job per merge.
  #
  # A rolling entry only grows on its own: each save is the restored entry
  # plus this run's objects, and Go trims only what sat unused for five days,
  # so one entry reached 3.5 GB in ten days and restoring it cost more than
  # the compile it saved (MUL-7547). Before saving, each job therefore drops
  # every entry this run did not use.
  #
  # -race lives only in nightly.yml (M-161): PR builds compile plain, so
  # `go build` and `go test` share one set of objects and neither is double
  # work; nightly re-proves the race-sensitive paths once a day. Nothing in
  # server/ carries a `race` build tag, so both modes accept the same code.
  #
  # `GOFLAGS=-count=1` because a rolling cache would otherwise let `go test`
  # replay cached results. Migrations are read from disk at run time rather
  # than embedded, so a schema change is invisible to a test binary's hash and
  # a cached "ok" from an untouched package could mask a real failure.

  # Build + vet + the release binaries. This job owns the module cache and its
  # own build-cache prefix; it produces the multica-be artifact on pushes so
  # M-151 can download instead of rebuilding (M-161).
  backend-build:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        id: go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep the security floor even when the setup-go manifest lags;
          # continue accepting newer patches within Go 1.27.
          go-version: "~1.27.3"
          check-latest: true
          cache: false

      # The only save side in this workflow: the explicit `go mod download`
      # below fills the complete graph before the post-step writes the
      # immutable go.sum-keyed entry.
      - name: Restore Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/go.sum') }}

      # ImageOS is a runner environment variable, not a context value, so a
      # shell step spells the build-cache key prefix once for restore and save.
      - name: Resolve Go build cache key
        id: gocache
        run: echo "prefix=go-build-build-${{ runner.os }}-${{ runner.arch }}-$ImageOS-${{ steps.go.outputs.go-version }}-" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.gocache.outputs.prefix }}

      # Go refreshes a cache entry's mtime when it uses it, but only once that
      # mtime is an hour old. So after the run, an entry no newer than an hour
      # before the first compile is one this run did not use. The prune step
      # before the save compares against this marker.
      - name: Mark Go build cache epoch
        id: goepoch
        run: touch -d '-1 hour' "$RUNNER_TEMP/go-build-epoch"

      # Complete module graph before any post-step save of the immutable key:
      # the test shards and agent job restore-only and must find everything.
      - name: Download module graph
        run: cd server && go mod download

      - name: Build
        run: cd server && go build ./...

      # The `agentintegration` files execute real agent CLIs, so no CI job runs
      # them. Nothing compiled them either, which let them rot silently: a
      # helper renamed in an ordinary test file, or two branches each defining
      # the same helper in one package, breaks the tagged build with every
      # untagged job still green. vet type-checks test files, so this is the
      # cheapest gate that keeps them honest without needing an agent CLI.
      - name: Vet tag-gated agent integration tests
        run: cd server && go vet -tags agentintegration ./...

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      # Build-once, deploy-that (M-161): make build emits the three release
      # binaries the lane ships, stamped with the same M-155 version string
      # deploy/dsh-z/deploy.sh uses, so the artifact and a lane rebuild report
      # identically. Runs on PRs too so a broken Makefile recipe fails before
      # merge; only the packaging/upload is push-only.
      - name: Build release binaries
        run: make build VERSION="$(node scripts/mmx-version.mjs --from-git)"

      - name: Stage multica-be artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist/multica-be/bin
          cp -a server/bin/server server/bin/migrate server/bin/multica dist/multica-be/bin/
          cp -a server/migrations dist/multica-be/migrations
          # M-155's single source for the release.json body (same script the
          # lane deploy uses), so CI and deploy emit the identical file.
          node scripts/mmx-version.mjs --release-json --ref "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" > dist/multica-be/release.json

      # Byte-compatible with deploy/dsh-z/deploy.sh releases/<sha>/ so M-151
      # unpacks in place; release.json comes from M-155's scripts/mmx-version.mjs,
      # the same generator the lane deploy calls.
      - name: Upload multica-be artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multica-be-${{ github.sha }}
          if-no-files-found: error
          path: dist/multica-be

      # Go's own trim (cmd/go/internal/cache) with this run as the window
      # instead of five days: only `-a`/`-d` entries, and an executable entry
      # is a directory, so it goes whole. See the job comment.
      - name: Prune Go build cache to this run's entries
        if: ${{ !cancelled() && github.event_name == 'push' && steps.goepoch.outcome == 'success' }}
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) \
            ! -newer "$RUNNER_TEMP/go-build-epoch" -exec rm -rf {} +
          du -sh ~/.cache/go-build

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.gocache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}

  # The DB-backed shard: everything outside pkg/ (cmd/, internal/) — the
  # packages whose tests touch Postgres/Redis (M-161 split; verified: no
  # pkg/*_test.go imports testutil or opens a DB). Services and migrations
  # live here only; the pure shard and the agent job start neither.
  backend-test-db:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multica -d multica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica?sslmode=disable
      # Wires up the RedisLocalSkill*_test.go suite. Distinct from REDIS_URL
      # (which would flip the server binary itself onto the Redis-backed
      # realtime relay + request stores); the tests talk to this Redis
      # directly so they run alongside the Postgres-backed suite.
      REDIS_TEST_URL: redis://localhost:6379/1
      GOFLAGS: -count=1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        id: go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Keep the security floor even when the setup-go manifest lags;
          # continue accepting newer patches within Go 1.27.
          go-version: "~1.27.3"
          check-latest: true
          cache: false

      # Restore-only: backend-build owns saving the module cache (complete
      # graph), so a shard can never pin an immutable go.sum key to its slice.
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/go.sum') }}

      - name: Resolve Go build cache key
        id: gocache
        run: echo "prefix=go-build-db-${{ runner.os }}-${{ runner.arch }}-$ImageOS-${{ steps.go.outputs.go-version }}-" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.gocache.outputs.prefix }}

      - name: Mark Go build cache epoch
        id: goepoch
        run: touch -d '-1 hour' "$RUNNER_TEMP/go-build-epoch"

      - name: Run migrations
        run: cd server && go run ./cmd/migrate up

      - name: Test DB-backed packages
        # pkg/agent has its own runner; this shard is cmd/ + internal/.
        run: bash scripts/test-go.sh --only db

      - name: Prune Go build cache to this run's entries
        if: ${{ !cancelled() && github.event_name == 'push' && steps.goepoch.outcome == 'success' }}
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) \
            ! -newer "$RUNNER_TEMP/go-build-epoch" -exec rm -rf {} +
          du -sh ~/.cache/go-build

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.gocache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}

  # The pure shard: server/pkg/** except pkg/agent. Verified by grep: no test
  # in this group imports internal/testutil, opens a DB or reads REDIS_TEST_URL,
  # so it runs without any service container (M-161).
  backend-test-pkg:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -count=1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        id: go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/go.sum') }}

      - name: Resolve Go build cache key
        id: gocache
        run: echo "prefix=go-build-pkg-${{ runner.os }}-${{ runner.arch }}-$ImageOS-${{ steps.go.outputs.go-version }}-" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.gocache.outputs.prefix }}

      - name: Mark Go build cache epoch
        id: goepoch
        run: touch -d '-1 hour' "$RUNNER_TEMP/go-build-epoch"

      - name: Test pure packages
        run: bash scripts/test-go.sh --only pkg

      - name: Prune Go build cache to this run's entries
        if: ${{ !cancelled() && github.event_name == 'push' && steps.goepoch.outcome == 'success' }}
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) \
            ! -newer "$RUNNER_TEMP/go-build-epoch" -exec rm -rf {} +
          du -sh ~/.cache/go-build

      - name: Save Go build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.gocache.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}

  # pkg/agent runs as its own group: ~2m20s for a single package, throttled to
  # -parallel 2 because its subprocess-backed tests carry hard deadlines (see
  # scripts/test-go.sh). Those tests are timer-bound rather than CPU-bound, so
  # the throttle stays and the package simply gets its own runner; it reads no
  # database, so no service containers either. Same trade as the frontend
  # split: more runner-minutes, less wall clock. Both Go caches are restored
  # but never saved here: backend-build owns the module entry (complete graph)
  # and this job's go-build-agent- prefix is published only on push by the
  # same pattern as the other shards; pkg/agent's own binary is cheap to relink.
  # -race moved to nightly.yml with the rest of the race suite (M-161).
  backend-agent-tests:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same policy as the test shards: CI always executes the tests it reports.
      GOFLAGS: -count=1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        id: go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "~1.27.3"
          check-latest: true
          cache: false

      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/go.sum') }}

      - name: Resolve Go build cache key
        id: gocache
        run: echo "prefix=go-build-agent-${{ runner.os }}-${{ runner.arch }}-$ImageOS-${{ steps.go.outputs.go-version }}-" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.gocache.outputs.prefix }}

      - name: Test agent package
        run: bash scripts/test-go.sh --only agent

  # Preserve the existing required-check name while allowing the shards,
  # generated SQL verification and the script checks to report independently.
  # The platform jobs, the vulnerability scan and -race moved to nightly.yml
  # (M-161), so this gate no longer waits on them.
  backend:
    needs: [changes, backend-build, backend-test-db, backend-test-pkg, backend-agent-tests, sqlc-check, script-checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check backend job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          JOB_SCOPES: '{"backend-build":"backend","backend-test-db":"backend","backend-test-pkg":"backend","backend-agent-tests":"backend","sqlc-check":"sqlc","script-checks":"scripts"}'
        run: node scripts/ci-scope.mjs gate

  script-checks:
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Test self-host env derivation
        run: bash scripts/selfhost-config.test.sh

      - name: Test check script
        run: bash scripts/check.test.sh

      - name: Test worktree database cleanup
        run: bash scripts/worktree-db.test.sh

      - name: Test development environment registry
        run: bash scripts/dev-env.test.sh

      - name: Test UI performance comparison runner
        run: bash scripts/perf-compare.test.sh

      - name: Verify reserved-slugs.ts is up to date
        # Re-runs the generator and fails on any drift from the
        # checked-in TypeScript output. The Go side embeds the JSON
        # source directly, so a passing diff here proves both sides
        # share one source of truth.
        run: |
          node scripts/generate-reserved-slugs.mjs
          git diff --exit-code -- packages/core/paths/reserved-slugs.ts

      - name: Verify attachment text-preview whitelist is up to date
        # The Go handler embeds the JSON source directly while the shared
        # web/desktop view consumes the checked-in generated TypeScript file.
        run: |
          node scripts/generate-attachment-text-preview.mjs
          git diff --exit-code -- packages/views/editor/utils/text-preview-whitelist.generated.ts

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Test Helm chart
        run: bash scripts/helm-config.test.sh

      - name: Test backend entrypoint signals
        run: bash scripts/entrypoint.test.sh

      - name: Test build output naming
        run: bash scripts/makefile-build.test.sh

  frontend-quality:
    needs: changes
    if: ${{ needs.changes.outputs.quality_only == 'true' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: ${{ needs.changes.outputs.self_hosted != 'true' && 'pnpm' || '' }}
      - name: Configure cache directories
        env:
          SELF_HOSTED: ${{ needs.changes.outputs.self_hosted }}
          UNREVIEWED_DEPS: ${{ needs.changes.outputs.unreviewed_deps }}
        run: |
          if [ "$SELF_HOSTED" != "true" ]; then
            echo "TURBO_CACHE_DIR=.turbo/cache" >> "$GITHUB_ENV"
          elif [ "$UNREVIEWED_DEPS" = "true" ]; then
            base="/mnt/workspace/cache/mmx/scratch/${GITHUB_RUN_ID}"
            mkdir -p "$base/pnpm-store"
            echo "PNPM_STORE_DIR=$base/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=$base/pnpm-store" >> "$GITHUB_ENV"
          else
            echo "PNPM_STORE_DIR=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
            echo "npm_config_store_dir=/mnt/workspace/cache/mmx/pnpm-store" >> "$GITHUB_ENV"
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend quality
        uses: ./.github/actions/frontend-quality
