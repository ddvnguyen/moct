# PR gate for ddvnguyen/moct.
#
# The job is named `ci` on purpose: that exact name is the required status
# check on `main` and on `integration`. Nothing else may be added to the
# required-checks list without changing this file.
#
# Order: frozen install -> typecheck -> build -> test. The same four commands
# are what a reviewer runs locally, so a green run means the tree is
# reproducible from the committed lockfile.
name: ci

on:
  pull_request:
  push:
    branches: [main, integration]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # The pnpm the repo resolves to locally (lockfileVersion 9.0).
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
