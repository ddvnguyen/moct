# DSH lane deploy — driven from the train owner (this repo).
#
# One dispatch installs one lane. The lane root is
# /mnt/workspace/clouds/dsh-<lane>; the lane profile is
# <lane-root>/data/home/profiles/web.
#
# The deploy code NEVER comes from the dispatched product sha:
#   deepseek-harness/ the fork at the resolved product sha (the thing being
#                   served AND the plugins repo's harness sibling: the plugins
#                   compile against its sources, so it must be a real
#                   directory next to the plugins checkout)
#   deploy-scripts/ the fork's REVIEWED integration branch (the release deploy
#                   script, scripts/deploy/dsh-deploy.sh)
#   harness-pin/    the fork at the pinned harness sha (the fork script's
#                   HARNESS_ROOT; its HEAD must equal HARNESS_SHA_EXPECT)
#   plugins/        the plugins repo at the resolved plugins sha (the DSH
#                   packages AND the codex-ui patch applier)
#
# Order: resolve the shas -> check out -> build the product -> install the DSH
# customizations into the lane profile (packages + codex-ui patch) -> run the
# fork's release deploy (which switches, restarts and smokes the lane) ->
# verify the lane answers and the expected package versions are installed.
#
# No sudo, no secrets: the lane is loopback-only and the token used here is
# the built-in GITHUB_TOKEN.
name: dsh-lane-deploy

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane to deploy'
        required: true
        type: choice
        default: 'x'
        options: [x, z]
      ref:
        description: 'Logical ref to deploy: integration (alpha), stable (released) or snapshot (with the date input)'
        required: true
        type: choice
        default: 'integration'
        options: [integration, stable, snapshot]
      date:
        description: 'Snapshot date token (ddMMyy, e.g. 20Oct26). Only used when ref = snapshot.'
        required: false
        type: string
      dry_run:
        description: 'Rehearse only: print the plan, change nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dsh-lane-deploy-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  deploy:
    name: dsh-lane-deploy
    runs-on: [self-hosted, linux, x64, clouds]
    timeout-minutes: 180
    env:
      LANE: ${{ inputs.lane }}
      GH_TOKEN: ${{ github.token }}
      CLOUDS_ROOT: /mnt/workspace/clouds
      # The pinned harness generation the fork script records in the release
      # manifest (see the fork's .github/workflows/deploy-dsh.yml).
      HARNESS_SHA: 19caaf271abf0d380f48d125b1d9548a53be8793
    steps:
      - name: Checkout the train owner (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Resolve the logical ref to shas
        id: resolve
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          DATE="${{ inputs.date }}"
          case "$REF" in
            integration|stable) : ;;
            snapshot) : ;;
            *) echo "unknown ref '$REF'" >&2; exit 2 ;;
          esac
          if [ "$REF" = "snapshot" ]; then
            if ! printf '%s' "$DATE" | grep -Eq '^[0-9]{2}[A-Z][a-z]{2}[0-9]{2}$'; then
              echo "ref=snapshot needs a date input in the ddMMyy shape (20Oct26), got '${DATE:-unset}'" >&2
              exit 2
            fi
            TOKEN="$DATE"
          else
            TOKEN=""
          fi
          # The branch each released/integration ref maps to comes from
          # deploy/train-repos.json, the train's single source of truth.
          BRANCHES="$(node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("deploy/train-repos.json", "utf8"));
            const logical = process.argv[1];
            const branch = (e) => logical === "stable" ? e.stable : e.integration;
            process.stdout.write([branch(m.repos.dsh), branch(m.repos.plugins)].join(" "));
          ' "$REF")"
          FORK_BRANCH="${BRANCHES%% *}"
          PLUGINS_BRANCH="${BRANCHES##* }"
          resolve_sha() { # $1 = repo, $2 = branch, $3 = tag ("" for a branch)
            local repo="$1" branch="$2" tag="$3" out=""
            if [ -n "$tag" ]; then
              # A snapshot tag is annotated: the peeled sha ("<ref>^{}") is the
              # commit the tag points at.
              out="$(git ls-remote "https://github.com/$repo" "refs/tags/$tag^{}" 2>/dev/null | head -n 1 | cut -f1 || true)"
            else
              out="$(git ls-remote "https://github.com/$repo" "refs/heads/$branch" 2>/dev/null | head -n 1 | cut -f1 || true)"
            fi
            if [ -z "$out" ]; then
              echo "ref '${tag:-$branch}' not found in $repo" >&2
              exit 3
            fi
            printf '%s' "$out"
          }
          FORK_SHA="$(resolve_sha ddvnguyen/deepseek-harness "$FORK_BRANCH" "$TOKEN")"
          PLUGINS_SHA="$(resolve_sha ddvnguyen/moct-dsh-team-room "$PLUGINS_BRANCH" "$TOKEN")"
          echo "ref=$REF"
          echo "fork branch=$FORK_BRANCH sha=$FORK_SHA"
          echo "plugins branch=$PLUGINS_BRANCH sha=$PLUGINS_SHA"
          echo "fork_sha=$FORK_SHA" >> "$GITHUB_OUTPUT"
          echo "plugins_sha=$PLUGINS_SHA" >> "$GITHUB_OUTPUT"
          echo "plugins_branch=$PLUGINS_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout the fork at the product sha (real directory, named like the plugins repo's harness sibling)
        uses: actions/checkout@v4
        with:
          repository: ddvnguyen/deepseek-harness
          ref: ${{ steps.resolve.outputs.fork_sha }}
          path: deepseek-harness
          persist-credentials: false

      - name: Checkout the reviewed fork ref (the deploy code)
        uses: actions/checkout@v4
        with:
          repository: ddvnguyen/deepseek-harness
          ref: integration
          path: deploy-scripts
          persist-credentials: false

      - name: Checkout the pinned harness generation
        uses: actions/checkout@v4
        with:
          repository: ddvnguyen/deepseek-harness
          ref: ${{ env.HARNESS_SHA }}
          path: harness-pin
          persist-credentials: false

      - name: Checkout the plugins repo at the plugins sha
        uses: actions/checkout@v4
        with:
          repository: ddvnguyen/moct-dsh-team-room
          ref: ${{ steps.resolve.outputs.plugins_sha }}
          path: plugins
          persist-credentials: false

      - name: Build the product
        working-directory: deepseek-harness
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install the DSH customizations into the lane profile
        env:
          PLUGINS_ROOT: ${{ github.workspace }}/plugins
          DSH_ROOT: /mnt/workspace/clouds/dsh-${{ inputs.lane }}
          PROFILE_DIR: /mnt/workspace/clouds/dsh-${{ inputs.lane }}/data/home/profiles/web
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          # The plugins commit this deploy ships. It names the artifact and is
          # written into the installed package, so the lane can answer "which
          # plugins commit am I running?" from a file.
          PLUGINS_SHA: ${{ steps.resolve.outputs.plugins_sha }}
          PLUGINS_BRANCH: ${{ steps.resolve.outputs.plugins_branch }}
          # The plugins repo resolves its harness sibling by that name; the
          # product checkout IS the harness and lives next to the plugins
          # checkout under that name. It must be a real directory, not a
          # symlink: the tsconfig facades resolve to the sibling's real path
          # and a symlink makes the TypeScript rootDir check fail.
          DSH_HARNESS_DIR: deepseek-harness
        run: |
          set -euo pipefail
          # The codex-ui applier comes from the plugins checkout (the manifest
          # names its path); the deploy-scripts checkout only carries the
          # fork's release deploy script.
          ./scripts/deploy/dsh-customizations-deploy.sh

      - name: Deploy the lane (release switch, restart, smoke)
        working-directory: ${{ github.workspace }}
        env:
          TARGET: ${{ inputs.lane }}
          REPO_ROOT: ${{ github.workspace }}/deepseek-harness
          HARNESS_ROOT: ${{ github.workspace }}/harness-pin
          HARNESS_SHA_EXPECT: ${{ env.HARNESS_SHA }}
          TRUSTED_HOST: dsh-${{ inputs.lane }}.ddvnguyen.com
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDS_ROOT: ${{ env.CLOUDS_ROOT }}
          SERVICE: dsh-${{ inputs.lane }}
          PORT: ${{ inputs.lane == 'x' && '3181' || '3180' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          bash deploy-scripts/scripts/deploy/dsh-deploy.sh

      - name: Verify the lane and the installed package versions
        if: ${{ !inputs.dry_run }}
        env:
          PORT: ${{ inputs.lane == 'x' && '3181' || '3180' }}
          PROFILE_DIR: /mnt/workspace/clouds/dsh-${{ inputs.lane }}/data/home/profiles/web
          PLUGINS_SHA: ${{ steps.resolve.outputs.plugins_sha }}
        run: |
          set -euo pipefail
          echo "--- lane root"
          # The lane serves its UI behind the session token it publishes in its
          # own journal, and it binds the address its unit names. The wildcard
          # bind is the contract: the release deploy refuses a unit that does
          # not carry --host 0.0.0.0, so the unit pins 0.0.0.0.
          # Take the URL the lane published for THIS boot; fall back to the
          # unit's --host address.
          URL="$(journalctl --user -u "dsh-${{ inputs.lane }}.service" -n 300 --no-pager \
            | grep -o 'http://[0-9A-Za-z._:/?=&-]*' | tail -n 1 || true)"
          if [ -z "$URL" ]; then
            UNIT="/home/ddv/.config/systemd/user/dsh-${{ inputs.lane }}.service"
            HOST="$(sed -n 's/.*--host \([^ ]*\) .*/\1/p' "$UNIT" 2>/dev/null | head -1 || true)"
            [ -n "$HOST" ] || HOST=127.0.0.1
            URL="http://$HOST:$PORT/"
          fi
          echo "lane url: $URL"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)"
          echo "GET / -> $CODE"
          case "$CODE" in
            200|303) : ;;
            *) echo "the lane did not answer $URL with a success code (got $CODE)" >&2; exit 1 ;;
          esac
          echo "--- installed packages"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const profile = process.argv[1];
            const sha = process.argv[2];
            const manifest = JSON.parse(fs.readFileSync("deploy/dsh-customizations.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync(path.join(profile, "package.json"), "utf8"));
            const deps = Object.assign({}, pkg.dependencies, pkg.devDependencies, pkg.optionalDependencies);
            const packages = manifest.repos[0].packages;
            let bad = 0;
            for (const p of packages) {
              const installedPath = path.join(profile, "node_modules", p.name, "package.json");
              const version = fs.existsSync(installedPath)
                ? JSON.parse(fs.readFileSync(installedPath, "utf8")).version
                : "MISSING";
              const spec = deps[p.name] || "MISSING";
              if (version === "MISSING") bad++;
              // The build marker names the commit the installed package was
              // built from. A version says nothing here: the version of a
              // plugin only moves on a release commit, so a stale install and
              // a good one carry the same version.
              const markerPath = path.join(profile, "node_modules", p.name, "build-info.json");
              let built = "MISSING";
              if (fs.existsSync(markerPath)) {
                try { built = JSON.parse(fs.readFileSync(markerPath, "utf8")).pluginsSha || "MISSING"; } catch { built = "UNREADABLE"; }
              }
              if (built !== sha) {
                console.error(`STALE ${p.name} was built from ${built}, this run ships ${sha}`);
                bad++;
              }
              console.log(`${p.name}  installed=${version}  build=${built}  spec=${spec}`);
            }
            // The @ddvnguyen scope must be exactly the manifest set: an extra
            // entry is an obsolete package left in the profile.
            const wanted = new Set(packages.map(p => p.name));
            for (const name of Object.keys(deps)) {
              if (!name.startsWith("@ddvnguyen/")) continue;
              if (wanted.has(name)) continue;
              console.error(`OBSOLETE ${name} is still in the profile`);
              bad++;
            }
            if (bad) { console.error(`${bad} problem(s) with the installed package set`); process.exit(1); }
            console.log(`the lane runs the plugins commit ${sha}`);
          ' "$PROFILE_DIR" "$PLUGINS_SHA"
