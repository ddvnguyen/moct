# Host-only plugin row. The browser half is discovered through package.json's
# `dsh.client` declaration; its host face registers the /multica transport that
# the islands call, so the row must be mounted for any of the rail rows to work.
- insert:
    - id: multica-dsh-plugin
      name: '@multica/dsh-plugin'
      config:
        # Where multica-be listens. The island never talks to it directly: the
        # host half proxies /multica/* and /multica/ws, so the token below stays
        # in this process and the browser sees one same origin.
        serverUrl: http://127.0.0.1:8080
        # Personal access token for the Multica user the panel speaks as.
        # Leave empty and set MULTICA_DSH_TOKEN in the dsh process instead.
        token: ''
        # Workspace the island opens. Empty selects the first workspace the
        # token can read.
        workspaceSlug: ''
        # Default dsh workspace folder for "All projects" (M-159): what the
        # Files/Terminal buttons address when no project is selected. Empty
        # disables them with "Choose a project". Leave empty and set
        # MULTICA_DSH_WORKSPACE_FOLDER in the dsh process instead. A selected
        # project addresses its own local_directory resource instead of this.
        workspaceFolder: ''
        # moct-be, for the browser's memory seam (docs/moct-seam.md out-path 3).
        # Leave empty and set MOCT_BASE_URL in the dsh process instead; with
        # neither set, /moct answers 503 and the memory surfaces stay hidden.
        moctUrl: ''
